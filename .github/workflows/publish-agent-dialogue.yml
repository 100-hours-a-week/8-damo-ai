name: Publish agent-dialogue image

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'services/agent_dialogue/**'
      - 'shared/**'
      - 'requirements.txt'
      - 'Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy Dockerfile to context root
        run: cp services/agent_dialogue/Dockerfile.runpod ./Dockerfile.runpod

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.runpod
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/100-hours-a-week/agent-dialogue:latest
            ghcr.io/100-hours-a-week/agent-dialogue:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
